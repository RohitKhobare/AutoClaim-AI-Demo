services:
  - type: web
    name: autoclaim-ai-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DB_SSL
        value: "true"
      - key: DEMO_PASSWORD
        value: Auto@123
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_DEMO_PASSWORD
        generateValue: true
